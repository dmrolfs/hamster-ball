# Application gates: format, lints, docs, locked tests, and the declared minimum compiler.
# Real-sandbox probes on supported macOS versions are a separate job family (hb-btp); here
# sandbox-dependent tests skip when the runner cannot nest sandbox-exec, so a green run here
# does not claim sandbox coverage.
# Branch protection must require the `gates` check; that is a repository setting, not code.
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "book.toml", ".github/workflows/book.yml"]
  # No path filter here: a required check that never starts leaves a docs-only PR pending forever.
  pull_request:
  workflow_dispatch:

# Read-only token, no secrets, no pull_request_target: a PR job holds no release credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A pushed-over PR run is stale; a run on main is the record for that commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Pinned so a new stable lint cannot break an unrelated PR. Bump deliberately.
  LINT_TOOLCHAIN: "1.100.0"
  # Must equal `rust-version` in Cargo.toml; the msrv job checks that they agree.
  MSRV: "1.88"

jobs:
  quality:
    name: quality (fmt, clippy, rustdoc, tests)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      # actions pinned to commit SHAs; the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          rustup toolchain install "$LINT_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
          rustup default "$LINT_TOOLCHAIN"
      # hb's sandbox allows only the Command Line Tools developer directory, which is what it was
      # built and measured against. The runner selects full Xcode, whose xcrun the ball blocks, so
      # git and python3 shims fail inside it. Selecting the supported configuration is not a claim
      # that Xcode-selected machines work (see the hb-je6 notes).
      - name: Select the Command Line Tools
        run: |
          test -d /Library/Developer/CommandLineTools
          sudo xcode-select -s /Library/Developer/CommandLineTools
          xcode-select -p
      - name: Runner facts
        run: |
          git rev-parse HEAD
          sw_vers
          uname -m
          sysctl -n hw.ncpu
          csrutil status
          rustc --version
      - name: Repeat synchronized cleanup tests
        env:
          HB_REQUIRE_SANDBOX: "1"
        run: |
          for attempt in $(seq 1 10); do
            echo "cleanup repetition $attempt"
            cargo test --locked --all-features --lib the_second_sweep_finds_a_holder_created_after_the_first_completed
            cargo test --locked --all-features --lib a_descendant_that_left_its_session_is_still_owned_and_killed
          done
          cargo test --locked --all-features --test descendant_cleanup -- --nocapture
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Rustdoc
        run: cargo doc --locked --no-deps --lib --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Tests
        run: cargo test --locked --all-features --no-fail-fast
        env:
          HB_REQUIRE_SANDBOX: "1"

  msrv:
    name: declared minimum compiler
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Cargo.toml and MSRV env agree
        run: |
          declared=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          test "$declared" = "$MSRV" || { echo "Cargo.toml rust-version=$declared, ci MSRV=$MSRV"; exit 1; }
      - name: Install declared minimum
        run: rustup toolchain install "$MSRV" --profile minimal
      - name: Build everything with the lockfile
        run: cargo +"$MSRV" build --locked --all-targets --all-features
      - name: Release build ships no test-support binary
        run: |
          cargo +"$MSRV" build --locked --release
          test -x target/release/hb
          if test -e target/release/hb-testdrive; then
            echo "hb-testdrive (test-support) was built without the test-support feature"
            exit 1
          fi

  # One stable name for branch protection to require.
  gates:
    if: always()
    needs: [quality, msrv]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed
        run: |
          test "${{ needs.quality.result }}" = success
          test "${{ needs.msrv.result }}" = success
