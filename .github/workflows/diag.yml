# TEMPORARY (hb-je6): time lsof on the hosted runner. Deleted before merge.
name: diag
on:
  pull_request:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: lsof +D on an empty temp dir, cold then warm
        run: |
          d=$(mktemp -d)
          python3 - "$d" <<'PY'
          import subprocess, sys, time
          d = sys.argv[1]
          for i in range(8):
              t = time.perf_counter()
              r = subprocess.run(["/usr/sbin/lsof", "-t", "+D", d], capture_output=True)
              print("run %d: %.0f ms rc=%d" % (i, (time.perf_counter() - t) * 1000, r.returncode))
          PY
