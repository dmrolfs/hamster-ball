# TEMPORARY (hb-je6): facts about the hosted runner. Deleted before merge.
name: diag
on:
  pull_request:
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: read
jobs:
  diag:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Facts
        run: |
          sw_vers; uname -m; sysctl -n hw.ncpu; csrutil status || true
          id; echo "HB_REQUIRE_SANDBOX=${HB_REQUIRE_SANDBOX-unset}"
          /usr/bin/sandbox-exec -p '(version 1)(allow default)' /usr/bin/true && echo "sandbox-exec works" || echo "sandbox-exec FAILS"
          /usr/bin/env -i HB_X=1 /bin/sleep 5 & p=$!; sleep 0.5
          echo "ps -E of /bin/sleep shows HB_X: $(ps -E -o command= -p $p | grep -c HB_X)"; kill $p
      - run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - name: Three tests alone, 5 times, with output
        run: |
          for _ in 1 2 3 4 5; do
            cargo test --locked --lib -- --nocapture --test-threads=1 session::sweep::tests::a_process_whose_environment_macos_hides session::relay::tests::a_child_that_never_stops session::pump::tests::output_that_arrives_shortly 2>&1 | grep -E "^test |test result|panicked|ms$|ms\b" || true
          done
      - name: Relay and pump modules together
        run: cargo test --locked --lib -- session::relay session::pump session::sweep 2>&1 | grep -E "FAILED|test result|panicked" || true
