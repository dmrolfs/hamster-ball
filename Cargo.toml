# ABOUTME: Cargo manifest for hamster-ball: the `hamster_ball` library and the `hb` binary.
# ABOUTME: Lints are strict by default (no unsafe, no unwrap/expect outside tests); see ref/Hamster-Ball-Design.md section 14.

[package]
name = "hamster-ball"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Run AI coding agents in a macOS Seatbelt sandbox configured per project in TOML."
repository = "https://github.com/dmrolfs/hamster-ball"
publish = false

[lib]
name = "hamster_ball"
path = "src/lib.rs"

[[bin]]
name = "hb"
path = "src/bin/hb.rs"

# A copy of `hb` that takes its Environment from variables, so tests can run the real
# process-level behaviour (signals, exit status) against a fixture project. Built only for tests.
[[bin]]
name = "hb-testdrive"
path = "src/bin/hb-testdrive.rs"
required-features = ["test-support"]

[features]
# Test-only entry points (a control profile without part of the floor). Enabled for this
# package's own tests through the self dev-dependency below; never part of a release build.
test-support = []

[dependencies]
clap = { version = "4.6.8", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
httparse = "1.10"
nix = { version = "0.32", default-features = false, features = ["event", "signal", "time", "user"] }
rustix = { version = "1.1", default-features = false, features = ["std", "process", "pty", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = { version = "0.11", default-features = false }
snafu = "0.9.2"
strum = { version = "0.28.0", features = ["derive"] }
toml = "1.2.1"
tokio = { version = "1.54", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
hamster-ball = { path = ".", features = ["test-support"] }
claims = "0.8.0"
idna = "1.1.0"
pretty_assertions = "1.4.1"
proptest = "1.11.0"
regex = "1"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
