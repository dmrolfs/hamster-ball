# agent/pi: pi 1.7.0, measured 2026-11-23 on 1.6.0 and 2026-11-27 on 1.7.0 (`--offline --list-models`, no model request).
#
# `~/.pi/agent` holds pi's state, login, packages and its launcher. It is written, except `bin` and
# `install`: those are what a plain `pi` runs outside the sandbox, so the agent must not be able to
# change them. pi runs without them being writable; its update check (`install/update.lock`) is denied.
# `tools = ["node"]` is needed (the launcher is a `#!/usr/bin/env node` script) and also makes the Node
# install readable, so there is no separate read of `~/.nvm`.
#
# Also not written (hb-82i), because pi loads them at start and a plain `pi` outside the sandbox would run what the agent put
# there: `settings.json` (its `packages` list names code to load), `models.json` and `models-store.json` (provider routing),
# `trust.json`, `extensions`, `npm`, `git` and `agents`. Measured on 1.7.0: with all of them denied `pi --offline
# --list-models` prints the same output and tries no write to them. Installing or changing a package, or granting trust,
# is done outside hb. `sessions` stays writable. `auth.json` (pi's login) stays writable so a token refresh can work;
# whether pi ever treats it as code is not measured.
#
# `~/.pi/agent/tmp/extensions` is also not written: pi unpacks extensions named on its command line (`-e npm:...`, `-e git:...`)
# there under a name that is the same every time, and reuses what it finds (pi 1.7.0, `getExtensionTempFolder`); a run that
# changed it would change what a later plain `pi -e ...` runs. Prepare such extensions outside hb. In the PROJECT, `.pi/settings.json`,
# `.pi/extensions`, `.pi/npm`, `.pi/git` and `.pi/agents` are not written either (pi loads them for a trusted project).
#
# No hosts: the model provider is yours. Put it in your own config:
#   [net]  allow = ["your-gateway.example.com"]   a gateway reached over HTTPS (the check used a remote one)
#   [net]  loopback_ports = [18089]               a gateway on this machine (pi's default provider is
#                                                 localhost:18089); loopback ports are not proxied
#   [tls]  extra_ca_files = ["~/path/to/ca.pem"]  a gateway with a private CA (hb sets NODE_EXTRA_CA_CERTS;
#                                                 without it pi fails with DEPTH_ZERO_SELF_SIGNED_CERT)
#
# Denied and harmless: ~/.agents/skills (user skills are not loaded), ~/.config/gcloud and Keychains probes.
[env]
tools = ["node"]

[fs]
write = ["~/.pi/agent"]
deny_write = [
  "~/.pi/agent/bin",
  "~/.pi/agent/install",
  "~/.pi/agent/settings.json",
  "~/.pi/agent/models.json",
  "~/.pi/agent/models-store.json",
  "~/.pi/agent/trust.json",
  "~/.pi/agent/extensions",
  "~/.pi/agent/npm",
  "~/.pi/agent/git",
  "~/.pi/agent/agents",
  "~/.pi/agent/tmp/extensions",
  ".pi/settings.json",
  ".pi/extensions",
  ".pi/npm",
  ".pi/git",
  ".pi/agents",
]

[tls]
system_trust = true
